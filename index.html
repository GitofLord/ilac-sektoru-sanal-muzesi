<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="İlaç Sektörü Sanal Müzesi">
<meta property="og:description" content="Workshop Dergisi ile Türk İlaç Sektörü Tarihi Sanal Müzesi · Created by Murat Gümrükçü">
<meta property="og:image" content="i/intro-poster.jpg">
<style>html,body{margin:0;padding:0;background:#0a0806}</style>
<title>İlaç Sektörü Sanal Müzesi</title>
<meta name="description" content="İlaç Sektörü Sanal Müzesi · Powered by Workshop Dergi · Created by Murat Gümrükçü. 1.056 eserlik 3B müze deneyimi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..700,0..100&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: tam ekran WebGL müze; HUD kenarlarda cam yüzeyler, katmanlar (modal, panel, tur) üstte. Gece müzesi: tek, bilinçli koyu dünya. */
:root{
  --ink:#0b0907; --ink-2:#14100b; --ink-3:#1d1710; --walnut:#2a2017;
  --panel:rgba(18,14,10,.80); --panel-2:rgba(26,20,14,.92);
  --line:rgba(201,162,39,.22); --line-2:rgba(201,162,39,.42);
  --brass:#c9a227; --gold:#e9c46a; --gold-2:#f4dca0; --cream:#f3ead6; --paper:#efe4cc;
  --mute:#a99b84; --dim:#6f6352; --ok:#8fc9a0; --bad:#e2775f; --teal:#7fc6c9;
  --period:#f0c98a;
  --display:'Fraunces','Playfair Display',Georgia,'Times New Roman',serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--cream)}
body{font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.mono{font-family:var(--mono)}
.disp{font-family:var(--display)}
.brass{color:var(--gold)}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
#fade{position:fixed;inset:0;background:#000;z-index:1;pointer-events:none;opacity:1;transition:opacity .9s}

/* glass */
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 10px 40px rgba(0,0,0,.5)}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.glass{background:var(--panel-2)}}
.ibtn{height:40px;min-width:40px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--cream);position:relative;overflow:hidden;transition:border-color .25s,background .25s,transform .18s var(--ease);white-space:nowrap}
.ibtn.glass:hover{border-color:var(--line-2);background:rgba(36,27,17,.86)}
.ibtn:active{transform:scale(.96)}
.ibtn svg{width:17px;height:17px;flex:none;color:var(--gold)}
.ibtn .lbl{display:inline}
.ibtn .badge{font-family:var(--mono);font-size:10px;color:var(--ink);background:var(--gold);border-radius:999px;padding:1px 6px;margin-left:2px}
.ibtn.on{border-color:rgba(233,196,106,.6);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .15s var(--ease),background .25s,border-color .25s,box-shadow .25s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn svg{width:17px;height:17px}
.btn-gold{background:linear-gradient(180deg,#f0d283,#c9a227);color:#1b1408;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 20px rgba(201,162,39,.25)}
.btn-gold:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 28px rgba(233,196,106,.42)}
.btn-ghost{border:1px solid var(--line);background:rgba(255,255,255,.03)}
.btn-ghost:hover{border-color:var(--line-2);background:rgba(255,255,255,.06)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(201,162,39,.08);color:var(--paper)}
.chip svg{width:13px;height:13px;color:var(--gold)}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(201,162,39,.35) transparent;user-select:text;-webkit-user-select:text}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(201,162,39,.35);border-radius:3px}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(233,196,106,.7),transparent)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .6s}
#hud>*{pointer-events:auto}
body.hud-off #hud,body.photo #hud,body.tour #hud .hide-tour{opacity:0;pointer-events:none}
body.hud-off #hud>*,body.photo #hud>*{pointer-events:none}
.room-badge{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));max-width:min(46vw,440px);padding:12px 16px 12px 14px;border-radius:16px;display:flex;gap:12px;align-items:center}
.room-badge .pip{width:10px;height:42px;border-radius:6px;background:linear-gradient(180deg,var(--period),transparent);flex:none;box-shadow:0 0 18px var(--period)}
.room-badge h1{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(16px,1.7vw,21px);line-height:1.15;color:var(--gold-2);font-variation-settings:"SOFT" 60,"opsz" 40;text-wrap:balance}
.room-badge p{margin:3px 0 0;font-size:12.5px;color:var(--mute);line-height:1.35}
.room-badge .meta{display:flex;gap:10px;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.room-badge .meta b{color:var(--paper);font-weight:500}
.toolbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 490px)}
.dd{position:relative}
.dd-menu{position:absolute;right:0;top:46px;width:210px;padding:6px;border-radius:14px;display:grid;gap:2px;transform-origin:top right;animation:pop .22s var(--ease)}
.dd-menu button{text-align:left;padding:9px 12px;border-radius:9px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.dd-menu button:hover{background:rgba(201,162,39,.12)}
.dd-menu button.cur{color:var(--gold)}
.dd-menu button small{font-family:var(--mono);font-size:10px;color:var(--dim)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
.near-cta{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:8px 18px 8px 8px;border-radius:16px;max-width:min(560px,calc(100vw - 32px));animation:rise .35s var(--ease);transition:box-shadow .25s}
.near-cta:hover{box-shadow:0 0 30px rgba(201,162,39,.3)}
.near-cta img{width:56px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--ink-3);flex:none}
.near-cta .t{min-width:0;text-align:left}
.near-cta .t b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.near-cta kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--gold);margin-left:4px}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.navbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 50px);display:flex;gap:8px;align-items:center}
.navbar .tour-btn{background:linear-gradient(180deg,rgba(240,210,131,.22),rgba(201,162,39,.12));border-color:rgba(233,196,106,.55)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:11px;color:rgba(243,234,214,.42);white-space:nowrap;pointer-events:none;letter-spacing:.02em}
.hint .touch{display:none}
.charplate{position:absolute;left:50%;top:13%;transform:translateX(-50%);padding:8px 16px 8px 12px;border-radius:999px;display:flex;align-items:center;gap:10px;animation:rise .3s var(--ease)}
.charplate .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:blink 1.6s infinite}
.charplate b{display:block;font-family:var(--display);font-size:15px;color:var(--gold-2);font-weight:600}
.charplate span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.charplate .ibtn{height:32px;font-size:12px;margin-left:6px}
@keyframes blink{50%{opacity:.4}}

/* minimap */
.minimap{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);border-radius:16px;overflow:hidden;width:236px}
.minimap header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--mute)}
.minimap header svg{width:14px;height:14px;color:var(--gold);transition:transform .3s}
.minimap.closed header .chev{transform:rotate(180deg)}
.minimap .body{padding:0 12px 10px}
.minimap.closed .body{display:none}
.minimap svg.map{width:100%;height:auto;display:block}
.minimap .foot{font-size:9.5px;color:var(--dim);text-align:center;margin-top:4px}
.presence{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--paper);padding:6px 10px;border-top:1px solid var(--line)}
.presence i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.map-room{cursor:pointer;transition:fill .25s}
.map-room:hover{fill:rgba(201,162,39,.18)}

/* audio */
.audio{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;gap:8px;padding:5px;border-radius:999px}
.audio .ibtn{height:36px;min-width:36px;padding:0 10px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--gold);border-radius:2px;height:4px}
.audio.playing .eq i{animation:eqa .9s ease-in-out infinite}
.audio.playing .eq i:nth-child(2){animation-delay:.15s}.audio.playing .eq i:nth-child(3){animation-delay:.3s}.audio.playing .eq i:nth-child(4){animation-delay:.45s}
@keyframes eqa{0%,100%{height:3px}50%{height:14px}}

/* jelly slider (Epic UI 03) */
.jelly{position:relative;width:132px;height:30px;touch-action:none;cursor:pointer;outline:none}
.jelly svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.jelly .val{position:absolute;right:-34px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;color:var(--mute);width:30px;text-align:right}
.jelly:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:999px}

/* cursor */
#cur,#curdot{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-radius:50%;will-change:transform}
#cur{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid rgba(243,234,214,.8);display:grid;place-items:center;transition:width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),background .3s,border-color .3s;mix-blend-mode:difference}
#cur span{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.14em;color:#000;opacity:0;transition:opacity .2s;white-space:nowrap}
#cur.big{width:74px;height:74px;margin:-37px 0 0 -37px;background:#fff;border-color:#fff}
#cur.big span{opacity:1}
#cur.btn{width:50px;height:50px;margin:-25px 0 0 -25px}
#cur.down{width:24px;height:24px;margin:-12px 0 0 -12px}
#curdot{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:var(--gold)}
@media (pointer:fine){html.cur-on,html.cur-on *{cursor:none!important}}
@media (pointer:coarse){#cur,#curdot{display:none}}

#tip{position:fixed;z-index:55;pointer-events:none;max-width:300px;padding:10px 13px;border-radius:12px;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .18s;font-size:12.5px}
#tip.show{opacity:1;transform:none}
#tip .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
#tip .t{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.25;margin-top:3px}

/* toast */
#toasts{position:fixed;z-index:70;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(520px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:center;padding:11px 18px 11px 12px;border-radius:999px;font-weight:600;font-size:13.5px;animation:tin .5s var(--spring);box-shadow:0 0 40px rgba(201,162,39,.18),0 10px 30px rgba(0,0,0,.5);max-width:100%}
.toast .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(201,162,39,.16);flex:none}
.toast .ic svg{width:16px;height:16px;color:var(--gold)}
.toast small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.toast.out{animation:tout .4s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-14px)}}

/* subtitle chip (room narration outside tour) */
#subchip{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 168px);max-width:min(720px,calc(100vw - 32px));padding:12px 18px;border-radius:14px;font-family:var(--display);font-size:16px;line-height:1.45;text-align:center;font-variation-settings:"SOFT" 80;animation:rise .4s var(--ease)}
#subchip .x{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;color:var(--mute);font-size:14px}
.karaoke span{transition:color .25s,opacity .25s;opacity:.42}
.karaoke span.on{opacity:1;color:var(--cream)}
.karaoke span.now{color:var(--gold-2)}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 90% at 50% 45%,rgba(12,10,7,.70),rgba(4,3,2,.94));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .35s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,calc(100vw - 32px));max-height:calc(100% - 48px);border-radius:22px;display:flex;flex-direction:column;animation:mpop .45s var(--spring);overflow:hidden}
@keyframes mpop{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
.m-head{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.m-head h2{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,30px);line-height:1.1;color:var(--gold-2);font-variation-settings:"SOFT" 50,"opsz" 72;text-wrap:balance}
.m-head p{margin:6px 0 0;color:var(--mute);font-size:13.5px;max-width:62ch}
.m-head .x{margin-left:auto;flex:none}
.m-body{padding:18px 22px 22px;min-height:0}
.xbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:background .2s,border-color .2s,transform .2s}
.xbtn:hover{background:rgba(255,255,255,.08);border-color:var(--line-2);transform:rotate(90deg)}
.xbtn svg{width:17px;height:17px}

/* detail */
#detail{position:fixed;inset:0;z-index:32;display:grid;grid-template-columns:1fr min(420px,38vw);background:rgba(4,3,2,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .3s}
.d-stage{position:relative;overflow:hidden;touch-action:none;display:grid;place-items:center;min-width:0;min-height:0}
.d-stage .imgwrap{position:relative;transition:transform .3s var(--ease);will-change:transform}
.d-stage .imgwrap.panning{transition:none}
.d-stage img.main{display:block;color:transparent;font-size:0;max-width:min(calc(100% - 120px),1400px);max-height:calc(100dvh - 180px);border:1px solid rgba(201,162,39,.25);box-shadow:0 0 80px rgba(201,162,39,.12),0 30px 80px rgba(0,0,0,.7);-webkit-user-drag:none;user-select:none;background:var(--ink-3)}
.d-stage .frame-glow{position:absolute;inset:-14px;border:1px solid rgba(233,196,106,.18);border-radius:4px;pointer-events:none}
.d-stage .loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.2em}
.d-stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.d-stage .nav svg{width:20px;height:20px}
.d-stage .nav.l{left:max(16px,env(safe-area-inset-left,0px))}.d-stage .nav.r{right:16px}
.d-tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;gap:6px;padding:5px;border-radius:999px}
.d-tools .ibtn{height:34px;min-width:34px;padding:0 11px;font-size:12px}
.d-strip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;justify-content:center;padding:0 16px;overflow:hidden}
.d-strip button{width:64px;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--line);opacity:.55;transition:opacity .2s,transform .2s,border-color .2s;flex:none;background:var(--ink-3)}
.d-strip button img{width:100%;height:100%;object-fit:cover}
.d-strip button:hover{opacity:1;transform:translateY(-3px)}
.d-strip button.cur{opacity:1;border-color:var(--gold);box-shadow:0 0 14px rgba(233,196,106,.4)}
.loupe{position:absolute;width:190px;height:190px;border-radius:50%;pointer-events:none;border:2px solid rgba(233,196,106,.85);box-shadow:0 0 0 6px rgba(0,0,0,.35),0 20px 50px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.4);background-repeat:no-repeat;background-color:#000;z-index:3}
.d-info{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(20,15,10,.85),rgba(10,8,6,.95))}
.d-info .top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) 12px 22px;border-bottom:1px solid var(--line)}
.d-info .top .no{font-family:var(--mono);font-size:11px;color:var(--mute);margin-right:auto;letter-spacing:.08em}
.d-info .sc{flex:1;padding:22px 24px 24px;min-height:0}
.d-info h2{font-family:var(--display);font-weight:600;font-size:clamp(20px,1.9vw,26px);line-height:1.18;margin:8px 0 12px;color:var(--gold-2);font-variation-settings:"SOFT" 60,"opsz" 60;text-wrap:balance}
.d-info .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.d-sec{margin-top:18px}
.d-sec h3{margin:0 0 8px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.22em;color:var(--gold);display:flex;align-items:center;gap:10px}
.d-sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.d-sec p{margin:0 0 10px;color:#ddd2bb;font-size:14.5px;line-height:1.65}
.d-sec .part{padding-left:12px;border-left:2px solid rgba(201,162,39,.3);animation:fade .4s}
.d-toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--gold);margin-top:6px;padding:6px 0}
.d-toggle svg{width:14px;height:14px;transition:transform .25s}
.d-toggle[aria-expanded=true] svg{transform:rotate(180deg)}
.d-src{font-size:12px;color:var(--mute);font-family:var(--mono);line-height:1.6;margin-top:6px}
.d-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 22px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line);background:rgba(10,8,6,.7)}
.d-actions .btn{height:44px;font-size:13.5px}
.fav.on svg{fill:var(--bad);color:var(--bad)}

/* archive */
.arc-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.field{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.field:focus-within{border-color:var(--line-2)}
.field svg{width:16px;height:16px;color:var(--mute);flex:none}
.field input,.field select{background:none;border:0;outline:0;min-width:0;font-size:14px}
.field select option{background:#1d1710}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{text-align:left;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.02);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 0 22px rgba(201,162,39,.2)}
.card .ph{aspect-ratio:4/3;background:var(--ink-3);overflow:hidden;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease),opacity .4s;opacity:0}
.card .ph img.ok{opacity:1}
.card:hover .ph img{transform:scale(1.06)}
.card .ph .heart{position:absolute;right:6px;top:6px;width:20px;height:20px;color:var(--bad)}
.card .tx{padding:8px 10px 10px}
.card .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:600;line-height:1.35}
.card .tx span{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.05em}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.seg{display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--mute);transition:background .2s,color .2s}
.seg button.on{background:rgba(201,162,39,.18);color:var(--gold-2)}
#lightbox{position:fixed;inset:0;z-index:40;background:rgba(3,2,1,.94);display:grid;place-items:center;animation:fade .3s;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
#lightbox .in{display:grid;gap:12px;justify-items:center;max-width:min(1000px,100%)}
#lightbox img{max-height:66vh;max-width:100%;border:1px solid var(--line);opacity:0;transition:opacity .5s}
#lightbox img.ok{opacity:1}
#lightbox .cap{text-align:center;max-width:70ch}
#lightbox .cap b{font-family:var(--display);font-size:20px;color:var(--gold-2);font-weight:600}
#lightbox .cap p{color:#d6cbb3;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0}
#lightbox .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}

/* chronology */
.chrono{position:relative;height:330px;margin:12px 0 4px}
.chrono .axis{position:absolute;left:3%;right:3%;top:50%;height:2px;background:rgba(201,162,39,.25);overflow:hidden}
.chrono .axis::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(233,201,108,.85),transparent);width:60%;animation:beam 4.5s linear infinite}
@keyframes beam{from{transform:translateX(-100%)}to{transform:translateX(220%)}}
.cnode{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.cnode .dot{width:12px;height:12px;border-radius:50%;background:rgba(201,162,39,.75);box-shadow:0 0 12px rgba(233,201,108,.6);transition:transform .25s;position:relative}
.cnode.cur .dot{width:16px;height:16px;background:var(--gold);box-shadow:0 0 18px rgba(233,201,108,.95)}
.cnode.cur .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--gold);animation:halo 2.4s infinite}
@keyframes halo{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.cnode .card2{position:absolute;width:8.6rem;padding:10px 10px;border-radius:12px;text-align:center;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;animation:cpop .6s var(--spring) both}
.cnode:hover .dot{transform:scale(1.3)}
.cnode:hover .card2{transform:translateY(-3px);box-shadow:0 0 22px rgba(201,162,39,.28)}
.cnode.cur .card2{border-color:rgba(233,196,106,.7);box-shadow:0 0 22px rgba(201,162,39,.3)}
.cnode.up .card2{bottom:26px}.cnode.dn .card2{top:26px}
.cnode .stem{position:absolute;width:1px;height:18px;background:rgba(201,162,39,.35)}
.cnode.up .stem{bottom:8px}.cnode.dn .stem{top:8px}
.card2 b{display:block;font-family:var(--display);font-size:20px;color:var(--gold-2);font-weight:600}
.card2 span{display:block;font-size:11px;color:var(--paper)}
.card2 small{display:block;font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:2px}
@keyframes cpop{from{opacity:0;transform:translateY(8px) scale(.7)}60%{transform:scale(1.06)}to{opacity:1;transform:none}}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding:0 4px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bars .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--gold),rgba(201,162,39,.25));transform-origin:bottom;animation:grow .7s var(--ease) both}
.bars .b em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--mute);margin-bottom:3px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bars-x{display:flex;gap:5px;padding:4px 4px 0}
.bars-x span{flex:1;min-width:0;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.vchrono{display:none;gap:8px}

/* guestbook */
.gb{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:20px}
.gb form{display:grid;gap:10px;align-content:start}
.gb input,.gb textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);outline:0;font-size:14px;user-select:text}
.gb input:focus,.gb textarea:focus{border-color:var(--line-2)}
.gb textarea{resize:none;min-height:96px;font-family:var(--body)}
.gb .err{color:var(--bad);font-size:12px;min-height:16px}
.gb .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-content:start}
.note{padding:16px;border-radius:14px;border:1px solid var(--line);animation:rise2 .5s var(--ease) both}
.note p{margin:0 0 10px;font-family:var(--display);font-size:15px;line-height:1.5;font-variation-settings:"SOFT" 100;color:#efe3c8}
.note .who{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.note .who b{color:var(--gold);font-weight:600}
.note.new{box-shadow:0 0 0 1px rgba(233,196,106,.7)}
.note .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-top:6px}
@keyframes rise2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.notice{font-size:12.5px;color:var(--mute);padding:10px 12px;border-radius:10px;border:1px dashed var(--line-2);line-height:1.5}

/* guide */
#guide{position:fixed;z-index:34;top:0;right:0;bottom:0;width:min(400px,100vw);display:flex;flex-direction:column;border-left:1px solid var(--line);transform:translateX(104%);transition:transform .5s var(--ease);background:linear-gradient(180deg,rgba(20,15,10,.9),rgba(10,8,6,.96));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#guide.open{transform:none}
#guide .gh{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) 14px 18px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(240,210,131,.4),rgba(201,162,39,.12));border:1px solid rgba(233,196,106,.5);flex:none}
.avatar svg{width:20px;height:20px;color:var(--gold)}
#guide .gh b{display:block;font-family:var(--display);font-size:17px;color:var(--gold-2);font-weight:600}
#guide .gh span{font-size:12px;color:var(--mute)}
#guide .msgs{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;animation:rise2 .3s var(--ease)}
.msg.u{align-self:flex-end;background:rgba(201,162,39,.18);border:1px solid rgba(201,162,39,.35)}
.msg.a{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .acts button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--gold)}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:4px;animation:bounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-5px);opacity:.5}}
.quick{display:grid;gap:8px;margin-top:6px}
.quick button{text-align:left;font-size:13px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);transition:border-color .2s,background .2s}
.quick button:hover{border-color:var(--line-2);background:rgba(201,162,39,.08)}
#guide form{display:flex;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) 16px;border-top:1px solid var(--line)}
#guide form input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);outline:0;user-select:text}
#guide .mode{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim);padding:0 18px 8px}

/* tour */
#tour{position:fixed;inset:0;z-index:25;pointer-events:none}
#tour .bar{position:absolute;left:0;right:0;height:9vh;background:rgba(0,0,0,.95);transform:scaleY(0);transition:transform .6s cubic-bezier(.22,1,.36,1)}
#tour .bar.t{top:0;transform-origin:top}#tour .bar.b{bottom:0;transform-origin:bottom}
#tour.on .bar{transform:scaleY(1)}
#tour .top{position:absolute;top:0;left:0;right:0;height:9vh;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));pointer-events:auto;opacity:0;transition:opacity .5s .3s}
#tour.on .top{opacity:1}
#tour .top .kick{color:var(--gold)}
.segbar{display:flex;gap:3px;flex:1;max-width:520px;margin:0 20px}
.segbar i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.segbar i.done{background:var(--gold)}
.segbar i.cur::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(var(--p,0))}
#tour .card{position:absolute;left:50%;bottom:calc(9vh + 14px);transform:translateX(-50%);width:min(860px,calc(100vw - 32px));border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;pointer-events:auto;animation:rise .5s var(--ease)}
#tour .cap .rn{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
#tour .cap h4{margin:4px 0 6px;font-family:var(--display);font-size:18px;color:var(--gold-2);font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#tour .cap .txt{font-family:var(--display);font-size:15.5px;line-height:1.55;font-variation-settings:"SOFT" 80;max-height:7.8em;overflow:auto}
#tour .cap .cnt{font-family:var(--mono);font-size:10.5px;color:var(--mute);float:right}
/* cassette (Epic UI 01) */
.deck{width:236px;display:grid;gap:10px;align-content:start}
.cassette{position:relative;width:236px;height:150px;border-radius:12px;background:linear-gradient(180deg,#2b241c,#1a150f);border:1px solid rgba(201,162,39,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.5)}
.cassette .label{position:absolute;left:12px;right:12px;top:10px;height:72px;border-radius:6px;background:linear-gradient(180deg,#efe2c2,#dccb9f);color:#2a2014;padding:6px 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.cassette .label b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em}
.cassette .label span{display:block;font-family:var(--display);font-size:13px;font-weight:600;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cassette .label .stripes{position:absolute;left:0;right:0;bottom:8px;height:8px;background:linear-gradient(180deg,#c9a227 0 33%,#9e3d2f 33% 66%,#2f5f63 66%)}
.cassette .win{position:absolute;left:42px;right:42px;top:46px;height:36px;border-radius:18px;background:#0e0b08;border:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.reel{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#f1e6cc 0 22%,#3a2f22 23% 30%,#d9c79c 31% 100%);position:relative}
.reel::before{content:"";position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 20deg,#2a2016 20deg 40deg,transparent 40deg 140deg,#2a2016 140deg 160deg,transparent 160deg 260deg,#2a2016 260deg 280deg,transparent 280deg)}
.cassette .bottom{position:absolute;left:44px;right:44px;bottom:0;height:34px;background:linear-gradient(180deg,#221c15,#15110c);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);border-top:1px solid rgba(201,162,39,.2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--gold)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.key{height:34px;border-radius:7px;background:linear-gradient(180deg,#3a3026,#241d15);border:1px solid rgba(201,162,39,.3);box-shadow:0 3px 0 #0d0a07,inset 0 1px 0 rgba(255,255,255,.08);display:grid;place-items:center;transition:transform .1s,box-shadow .1s}
.key svg{width:15px;height:15px;color:var(--gold-2)}
.key:active,.key.down{transform:translateY(3px);box-shadow:0 0 0 #0d0a07,inset 0 1px 0 rgba(255,255,255,.05)}
.key[disabled]{opacity:.35}
.vu{display:flex;gap:2px;height:16px;align-items:flex-end}
.vu i{flex:1;background:linear-gradient(180deg,#e2775f,#e9c46a 30%,#8fc9a0);border-radius:1px;height:10%;opacity:.85}

/* passport */
.pass{display:grid;grid-template-columns:1fr 1.3fr;gap:0;border-radius:16px;overflow:hidden;border:1px solid var(--line-2);background:linear-gradient(135deg,#2b1f14,#1a120c)}
.pass .pg{padding:22px;position:relative;min-width:0}
.pass .pg:first-child{border-right:1px dashed rgba(201,162,39,.35);background:radial-gradient(120% 100% at 0 0,rgba(201,162,39,.12),transparent 60%)}
.pass h3{margin:0;font-family:var(--display);font-size:22px;color:var(--gold-2);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.18)}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;color:var(--cream);font-variant-numeric:tabular-nums;line-height:1.05}
.stat span{font-size:11.5px;color:var(--mute)}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stamp{aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(201,162,39,.3);display:grid;place-items:center;text-align:center;padding:8px;position:relative}
.stamp span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--dim);line-height:1.3}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp.got{border-color:transparent}
.stamp.got span{display:none}
.stamp.slam svg{animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.2) rotate(-25deg);opacity:0}60%{opacity:1}to{transform:scale(1);opacity:1}}
.caps{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.caps i{width:20px;height:28px;border-radius:10px;border:1px dashed rgba(201,162,39,.35)}
.caps i.got{border:0;background:linear-gradient(90deg,#f4dca0,#c9a227 50%,#8a6a16);box-shadow:0 0 10px rgba(233,196,106,.6)}
/* hold to confirm (Epic UI 08) */
.hold{position:relative;overflow:hidden;border:1px solid rgba(226,119,95,.45);color:#f1b3a3;background:rgba(226,119,95,.06)}
.hold .fill{position:absolute;inset:0;background:rgba(226,119,95,.3);transform-origin:left;transform:scaleX(0)}
.hold span{position:relative}
/* receipt (Epic UI 01) */
.printer{width:min(360px,100%);margin:0 auto;position:relative}
.printer .slot{height:30px;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,#3a3026,#1c1610);border:1px solid rgba(201,162,39,.35);position:relative;z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.printer .slot::after{content:"";position:absolute;left:18px;right:18px;bottom:6px;height:4px;border-radius:2px;background:#000}
.paper{margin:-6px 18px 0;background:#f6efdf;color:#1f1a12;font-family:var(--mono);font-size:12px;line-height:1.55;padding:18px 18px 26px;position:relative;z-index:1;clip-path:inset(0 0 100% 0);user-select:text;-webkit-user-select:text;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle at 6px 8px,transparent 5px,#000 5.5px) bottom/12px 9px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle at 6px 8px,transparent 5px,#000 5.5px) bottom/12px 9px repeat-x}
.paper.print{animation:print 2.6s steps(26) forwards}
@keyframes print{to{clip-path:inset(0 0 0 0)}}
.paper .c{text-align:center}
.paper hr{border:0;border-top:1px dashed #8b7d63;margin:8px 0}
.paper .r{display:flex;justify-content:space-between;gap:10px}
.barcode{height:44px;margin-top:10px;background:repeating-linear-gradient(90deg,#1f1a12 0 2px,transparent 2px 4px,#1f1a12 4px 5px,transparent 5px 8px,#1f1a12 8px 11px,transparent 11px 12px)}

/* palette */
#pal{position:fixed;inset:0;z-index:45;display:grid;place-items:start center;padding:12vh max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:rgba(2,1,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.pal-box{width:min(640px,100%);border-radius:20px;overflow:hidden;animation:pop .3s var(--ease)}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal-in svg{width:18px;height:18px;color:var(--mute)}
.pal-in input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;user-select:text}
#palList{max-height:54vh;padding:6px}
#palList button{display:grid;grid-template-columns:44px 1fr auto;gap:12px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;align-items:center}
#palList button.sel,#palList button:hover{background:rgba(201,162,39,.1)}
#palList .ic{width:44px;height:34px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.04);overflow:hidden}
#palList .ic img{width:100%;height:100%;object-fit:cover}
#palList .ic svg{width:17px;height:17px;color:var(--gold)}
#palList .pt{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#palList .ps{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#palList .pk{font-family:var(--mono);font-size:10px;color:var(--dim)}
.pal-ft{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mute)}

/* photo mode */

/* map overlay (Epic UI 06 diorama) */
.mapwrap{position:relative;display:grid;place-items:center;min-height:380px;perspective:1400px}
.iso{position:relative;width:460px;height:340px;transform-style:preserve-3d;transition:transform .9s var(--ease)}

.blk:hover .top{background:rgba(201,162,39,.28)}

.callout{position:absolute;pointer-events:none;font-family:var(--mono);font-size:10px;color:var(--gold);white-space:nowrap;transform:translate(-50%,-100%);padding:3px 7px;border-radius:6px;background:rgba(10,8,6,.85);border:1px solid var(--line)}
.youdot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#ffd678;box-shadow:0 0 0 4px rgba(255,214,120,.25),0 0 16px #ffd678;transform-style:preserve-3d;animation:blink 1.8s infinite}

/* intro */
#intro{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden}

.litbtn{position:absolute;z-index:2;left:calc(var(--lxp,22%) + 46px);top:calc(var(--handleY,300px) + 22px);font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}

.stage{position:absolute;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));z-index:1;overflow-y:auto}

.orn{display:flex;align-items:center;gap:14px}

.credit{margin-top:12px;font-size:13px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.howto div{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;font-size:12.5px;color:rgba(243,234,214,.8);line-height:1.35}
.howto svg{width:20px;height:20px;color:var(--gold);flex:none}
/* fabric button (Epic UI 04) */
.fabric{position:relative;margin-top:24px;height:62px;padding:0;border-radius:18px;min-width:min(440px,100%)}
.fabric .surf{position:absolute;inset:0;border-radius:18px;background:linear-gradient(180deg,#f3d88c,#d4ab3d 55%,#a8801f);filter:url(#cloth);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.25),0 14px 40px rgba(201,162,39,.3);transition:transform .2s var(--ease),box-shadow .3s}
.fabric .surf::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px);mix-blend-mode:overlay}
.fabric .surf::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120px circle at var(--fx,50%) var(--fy,50%),rgba(0,0,0,.22),transparent 60%);opacity:0;transition:opacity .25s}
.fabric:hover .surf::after{opacity:1}
.fabric:active .surf{transform:scale(.985) translateY(1px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.25),0 6px 18px rgba(201,162,39,.25)}
.fabric .txt{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;height:100%;padding:0 26px;font-weight:700;font-size:14.5px;letter-spacing:.14em;color:#20180a}

.fabric[disabled]{opacity:.55;cursor:wait}
.fabric.breathe .surf{animation:breathe 2.5s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.25),0 14px 60px rgba(233,196,106,.6)}}
.loadbar{width:min(440px,100%);height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:12px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--gold-2));transition:width .3s}
.countline{margin-top:10px;font-size:13px;color:var(--mute)}

.introsound{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px))}
/* ticket */
#ticket{position:fixed;z-index:52;left:50%;top:50%;width:340px;transform:translate(-50%,-50%);pointer-events:none}
#ticket .tk{display:grid;grid-template-columns:1fr 92px;background:linear-gradient(135deg,#f6ecd2,#e3cf9c);color:#2a1e0c;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden;animation:tkin .7s var(--spring) both}

#ticket.tear .s{animation:tear .7s var(--ease) forwards}

@keyframes tkin{from{transform:translateY(40px) rotate(-6deg) scale(.8);opacity:0}to{transform:rotate(-2deg);opacity:1}}

#confetti{position:fixed;inset:0;z-index:65;pointer-events:none}

/* ===== Intro v2: Workshop editoryal ===== */
#intro.ed{background:#0a0806}

.ed-stage{position:absolute;inset:0;overflow-y:auto;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 28px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));z-index:2}

const NARR = {"welcome": "İlaç Sektörü Sanal Müzesi'ne hoş geldiniz. Bu salonlarda, Workshop dergisinin sayfalarından ve kişisel arşivlerden derlenen bin elli altı eser sizi bekliyor. Kapılardan geçtikçe zamanda yolculuk edeceksiniz: 2008'den 2020'ye, oradan da Türkiye'nin ilk ilaç fabrikalarının hikâyesine. Rehberli turu başlatabilir ya da dilediğiniz salona kendiniz yürüyebilirsiniz. İyi gezintiler.", "outro": "Turumuzun sonuna geldik. Bu müze, sektörün dünüyle bugününü birbirine bağlayan küçük ama samimi bir hafıza. Pasaportunuzdaki damgaları tamamlamayı, ziyaretçi defterine bir not bırakmayı unutmayın. Bizi ziyaret ettiğiniz için teşekkürler.", "rooms": {"giris": "Giriş Salonu. Müzenin kalbindesiniz. Sol kanattaki kapılar 2008'den 2017'ye uzanan dönem koridorlarına, sağ kanattakiler 2018, 2019 ve 2020 salonlarına açılıyor. Arka duvardaki kapı ise Serkan Yağcıoğlu Arşivi'ne çıkıyor.", "donem-2008-2011": "2008–2011 Koridoru. Nostalji turunun ilk durağı. Workshop dergisi yayın hayatına 2008'de başladı; bu koridorda o ilk yılların kapak konularını, atamalarını ve sektörün tanıdık yüzlerini göreceksiniz. Burada iki yüz on yedi eser var.", "donem-2012-2014": "2012–2014 Koridoru. Dönüşüm yıllarının tanıklığı. Pharma-Meet buluşmaları, yeni atamalar ve iş mükemmelliğinin sektörde yavaş yavaş kendine yer açtığı günler. Bu koridorda iki yüz altı eser sergileniyor.", "donem-2015-2017": "2015–2017 Koridoru. Dijitalleşme ve yenilik çağı. Müzenin en kalabalık koridoru; iki yüz kırk üç eserle sektörün değişen dilini, yeni ürünlerini ve unutulmaz portrelerini izleyeceksiniz.", "donem-2018": "2018 Salonu. Yoğun bir yılın kayıtları. Nadir hastalıklar dosyasından iyi yönetim ödüllerine, yüz yirmi eserle tek bir yılın nabzı.", "donem-2019": "2019 Salonu. Sektörün nabzını tutan bir yıl. Stratejik liderlik tartışmaları, Parkinson ve MS odak konuları, yeni genel müdürler. Yüz yirmi dokuz eser sizi bekliyor.", "donem-2020": "2020 Salonu. Pandemi yılında ilaç sektörü. Dergi kapaklarına Covid-19 düştü, kongreler ekrana taşındı. Yüz altı eserle zor ama öğretici bir yıl.", "kisisel": "Serkan Yağcıoğlu Arşivi. İE Kimya Evi'nden Deva'ya, Gripin'den Recordati'ye, Bayer'den Squibb'e uzanan bir kariyer yolculuğu ve Türkiye ilaç sanayisinin kuruluş hikâyeleri. Otuz beş eserlik bu oda, müzenin en derin hafızası."}, "stops": {"donem-2008-2011-0019": "Bu sayı, arşivdeki eksik parçaydı. Kapak konusu etkinlik yönetimi. Yıllar sonra Pfizer'in genel müdürlüğünü yapacak olan Elif Aral, o tarihte ilk yurt dışı görevine, Orta Asya ve Kafkasya bölge direktörlüğüne başlamıştı.", "donem-2008-2011-0090": "Yeniden yapılandırma! Dönemin en cafcaflı konusu. Portre bölümü her sayıda sektörün renkli bir kişisini tanıtıyordu. Sahayı yeniden yapılandırmak çoğu zaman mümessil azaltmak diye anlaşıldı; mayın tarlalarına basan firmalar da az olmadı.", "donem-2008-2011-0146": "Koridorun sonunda küçük bir sürpriz. Workshop dergisi 2008'de yayın hayatına başladığı için bu tur da 2008'den başlıyor. Daha eski yıllar için Farmaskop dergisinin sayfalarına göz atmak gerekecek.", "donem-2012-2014-0038": "Portre bölümünde Serkan Erkovan var; o günlerde ürün müdürü. Röportajındaki tavsiye bugün de geçerli: Merakınızın peşinden gidin. Aynı aylarda sektörde pek çok önemli atama yaşanıyordu.", "donem-2012-2014-0109": "2013 yılı ve iş mükemmelliği. O yıllarda kapsamı ne kadar dar gördüğümüz bugün daha net anlaşılıyor. Veri çoğaldıkça, dijital dönüşüm hızlandıkça iş mükemmelliği biriminin gücü de büyüdü.", "donem-2012-2014-0142": "Bayer'e yeni CEO gelmiş: Hubert Braun. Çağlar Gözüaçık'ın Neden Olmasın köşesinde sağlık iletişiminde mobilin önemi anlatılıyor. Atamalar sayfası yine hareketli.", "donem-2015-2017-0059": "Bu ay dergide iki enfes yazı var: Biri Ozan Batıgün'den iş yaşamı üzerine, diğeri Hasan Gez'den, fizikçi Feynman'ı müthiş metaforlarla anlatan bir deneme.", "donem-2015-2017-0082": "Erkan Özgür. IMS Health Almanya'da bilgi işlem uzmanı olarak başlamış ve 1991'de Türkiye IMS organizasyonunu kurması istenmiş. Hemen yanında Bayer Oftalmoloji'nin EYExperience projesi; bugün olsa adı Metaverse olurdu belki.", "donem-2015-2017-0163": "Koridoru bir nostalji bonusuyla kapatıyoruz. Farklı dergilerden ve kaynaklardan derlenen, sektörün geçmişine ait hatıralar. Yüzünüzde bir gülümsemeyle izleyin.", "donem-2018-0008": "Ocak–Şubat 2018'in dosya konusu nadir hastalıklar; bu alandaki firmalar resmi geçit yapmış. Evren Özlü'nün o tarihteki yirmi dört yıllık deneyiminin on bir yılı Boehringer'de geçmiş.", "donem-2018-0046": "Daha iyi bir iş yeri olmak. Santa Farma, liderlerini değil ekibini öne çıkarmış. Berko ve Gilead insan kaynakları uygulamalarını anlatıyor.", "donem-2018-0091": "Nobel'in onkoloji ve nadir hastalıklar birimleri birlikte düşünüldüğünde güçlü bir portföy. Ali Raif'ten Canan Ergün de onkoloji ve hematoloji çalışmalarını anlatıyor.", "donem-2019-0016": "Odak konusu Parkinson. Abdi İbrahim'den Cenkay Türedi tedavi alanlarında liderliği hedeflediklerini söylüyor. Gen İlaç ise geliştirdikleri Parkinson bilekliğini tanıtıyor.", "donem-2019-0065": "Atamalar: Mustafa Cem Açık, Pfizer Türkiye Genel Müdürü olmuş. Oğuz Akandil ise Mustafa Nevzat'ta ticari direktör olarak atanmış.", "donem-2019-0096": "Stratejik liderlik sayısı. Ayşe Tuğba Şanlıoğlu, Süha Taşpolatoğlu, Sami Kiresepi ve Selim Giray liderliği anlatıyor. Ortak nokta: strateji bir anlık parlama değil, bir alışkanlık.", "donem-2020-0026": "68. sayı, Mart–Mayıs 2020. Kapaktaki Covid-19 logosu her şeyi anlatıyor: kâbus dünyanın üstüne çökmüştü. Buna rağmen atamalar ve projeler devam ediyordu.", "donem-2020-0071": "Pandemi döneminde Abdi İbrahim Psikiyatri ekibi eğitim çalışmalarına adeta televizyon stüdyosundan katılıyor. İnsan kaynakları denince akla gelen isim yine Feyza Aysan.", "donem-2020-0079": "Ve online kongreler! Santa Farma epilepsi çalışmalarını anlatıyor. Kongre salonları ekrana taşınmış, kahveler uzaktan içilmeye başlanmış.", "kisisel-0007": "Deva'nın hikâyesi. İlk üretim tesisi 1960'ta Beyoğlu Tünel'de açılır, 1963'te Bomonti fabrikası gelir. Deva, 1973'te Farmitalia, 1978'de Carlo Erba fabrikalarını satın alarak üretim kapasitesini büyütür.", "kisisel-0014": "Gripin'in doğuşu. Eczacı Necip Akar ve ağabeyi Cemil Akar, parasetamolden geliştirdikleri formülü 1935'te ruhsatlandırır. İsim basit ve akılda kalıcıdır: Grip kelimesine Aspirin'in sonundaki in eki eklenir. Necip Akar daha sonra ilk yerli tuvalet sabunu Puro'yu da piyasaya sürer.", "kisisel-0033": "1955'te Bayer, Schering, Knoll ve Merck, Doktor Feridun Frik'in ortaklığında Topkapı'da Birleşik Alman İlaç Fabrikası'nı kurar. Dr. Frik 1968'de kendi şirketini kurar; bu şirket 2011'de Recordati tarafından satın alınır."}};

function holdToConfirm(btn, ms, fn) {
  const fill = btn.querySelector('.fill'); let t0 = 0, raf = 0, done = false;
  const reset = () => { cancelAnimationFrame(raf); raf = 0; fill.style.transition = 'transform .3s'; fill.style.transform = 'scaleX(0)'; };
  const step = () => { const p = Math.min(1, (performance.now() - t0) / ms); fill.style.transition = 'none'; fill.style.transform = `scaleX(${p})`; if (p >= 1 && !done) { done = true; fn(); return; } raf = requestAnimationFrame(step); };
  btn.addEventListener('pointerdown', (e) => { if (done) return; t0 = performance.now(); btn.setPointerCapture(e.pointerId); raf = requestAnimationFrame(step); });
  ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach((ev) => btn.addEventListener(ev, () => !done && reset()));
  btn.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !raf && !done) { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); } });
  btn.addEventListener('keyup', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !done) reset(); });
}

const Tour = (() => {
  let stops = [], idx = 0, paused = false, timers = [], mode = 'audio', active = false, startT = 0, durT = 0, raf = 0, reelA = 0, voiceOn = ST.settings.voiceOn !== false, kind = 'main';

  }

    return favs.map((e) => ({ type: 'exhibit', roomId: e.roomId, exhibitId: e.exhibitId, title: exhibitTitle(e), text: fallbackText(e) }));
  }
  function fallbackText(e) { const cap = (e.caption ?? '').trim(); if (cap.length > 12) return cap; const b = [(e.heading ?? '').trim(), (e.textBefore ?? '').split(' | ')[0]?.trim()].filter(Boolean).join(' '); return b.length > 8 ? b : exhibitTitle(e); }
  function clear() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function start(which = 'main') {
    if (!ENG) return; kind = which;
    stops = which === 'favs' ? favItinerary() : itinerary();
    if (!stops.length) { toast('Favori eser yok', 'Önce birkaç eseri favorilere ekle', 'heart'); return; }
    click(); AudioSys.stopSpeak(); $('#subchip')?.remove();
    Layer.stack.slice().forEach((s) => Layer.close(s.id, true)); closeDetail(true); Guide.close(); Photo.exit();

  }
  function stop(silent) {
    if (!active) return; clear(); AudioSys.stopSpeak(); active = false; UI.tour = false; paused = false;
    document.body.classList.remove('tour'); root.classList.remove('on'); ENG && ((ENG.tourMode = false), (ENG.cine = 0), ENG.clearFocus());
    setTimeout(() => { if (!active) root.innerHTML = ''; }, 600); cancelAnimationFrame(raf); raf = 0; syncInput(); renderNear();
    if (!silent) click();
  }
  function run(i) {
    clear(); AudioSys.stopSpeak();
    if (i >= stops.length) { finish(); return; }
    idx = Math.max(0, i); paused = false; const st = stops[idx];
    const need = ENG.roomId !== st.roomId; if (need) ENG.loadRoom(st.roomId);
    renderCard(st); renderKeys();
    later(() => {
      if (!active) return;
      if (st.type === 'exhibit') { ENG.cine = 0; ENG.focusExhibit(st.exhibitId); markSeen(DATA.byId.get(st.exhibitId)); const my = st.exhibitId; setTimeout(() => { if (UI.tour && ENG.focused && ENG.focused === ENG.findFrame(my)) ENG.cinePush?.(my); }, 1400); } else { ENG.clearFocus(); ENG.cine = 1; }
      speak(st);
    }, need ? 1700 : 260);
  }
  function speak(st) {
    startT = performance.now(); durT = clamp((st.text?.length ?? 0) * 58, 6500, 15000);
    const done = () => active && !paused && later(() => run(idx + 1), 1300);
    if (voiceOn && st.audio) { mode = 'audio'; AudioSys.speak(st.audio, { onTime: (t, d) => karaoke(t / d), onEnd: (err) => { if (err === 'error') { fallbackVoice(st, done); } else done(); } }).then((ok) => { if (!ok) fallbackVoice(st, done); }); }

// ================= KEYBOARD =================
addEventListener('keydown', (e) => {
  const tag = e.target?.tagName; const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (e.key === 'Escape') { if ($('#pal')) { Layer.close('pal'); return; } if (Photo.on && !Layer.any()) { Photo.exit(); return; } if (Layer.closeTop()) return; if (Guide.isOpen()) { Guide.close(); return; } if (UI.tour) { Tour.stop(); return; } return; }
  if (!introDone) return;
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openPalette(); return; }
  if (typing) return;
  const top = Layer.stack[Layer.stack.length - 1]; if (top?.wrap?._keys) { top.wrap._keys(e); return; }
  if (Layer.any()) return;
  const k = e.key.toLowerCase();
  if (Photo.on) { if (k === ' ') { e.preventDefault(); Photo.shoot(); } return; }
  if (k === '/') { e.preventDefault(); openPalette(); }
  else if (k === 'm' && !e.repeat) { AudioSys.setMuted(!ST.settings.muted); }
  else if (k === 't' && !e.repeat) UI.tour ? Tour.stop() : Tour.start();
  else if (k === 'g' && !e.repeat) Guide.toggle();

  function render() {
    for (let k = Math.max(0, cur - 7); k <= Math.min(items.length - 1, cur + 7); k++) if (!nodes.has(k)) { const n = el('div', { class: 'fl-item' }, '<img alt="">'); setImg(n.firstChild, items[k].exhibitId); n.onclick = () => { if (k === cur) { Layer.close('flow'); openDetail(items[k], { fromEngine: true }); } else { cur = k; AudioSys.play('page', 0.3); render(); } }; st.append(n); nodes.set(k, n); }
    for (const [k, n] of nodes) { const o = k - cur, a = Math.abs(o); if (a > 7) { n.remove(); nodes.delete(k); continue; } n.style.zIndex = 100 - a; n.style.opacity = a > 5 ? 0 : 1; n.style.filter = a ? `brightness(${1 - Math.min(a, 4) * 0.13})` : 'none'; n.style.transform = a === 0 ? 'translateZ(160px)' : `translateX(${Math.sign(o) * (150 + a * 92)}px) rotateY(${-Math.sign(o) * 58}deg) translateZ(${-a * 30}px)`; }
    const e = items[cur]; cap.innerHTML = `<b>${esc(exhibitTitle(e))}</b><div class="kick" style="margin-top:4px">${esc(dateLine(e))} · ${cur + 1} / ${items.length}</div><div style="margin-top:10px;display:flex;gap:8px;justify-content:center"><button class="btn btn-gold" id="flOpen">${I('eye')}İncele</button><button class="btn btn-ghost" id="flGo">${I('door')}Müzede gör</button></div>`;
    cap.querySelector('#flOpen').onclick = () => { Layer.close('flow'); openDetail(e, { fromEngine: true }); };
    cap.querySelector('#flGo').onclick = () => { Layer.close('flow'); viewInMuseum(e); };
  }
  const go = (d) => { const n = clamp(cur + d, 0, items.length - 1); if (n !== cur) { cur = n; AudioSys.play('page', 0.25); render(); } };
  ov.querySelector('.xbtn').onclick = () => Layer.close('flow');
  let wacc = 0; st.addEventListener('wheel', (e) => { e.preventDefault(); wacc += e.deltaY + e.deltaX; if (Math.abs(wacc) > 60) { go(Math.sign(wacc)); wacc = 0; } }, { passive: false });
  let sx = null; st.addEventListener('pointerdown', (e) => (sx = e.clientX)); st.addEventListener('pointerup', (e) => { if (sx != null && Math.abs(e.clientX - sx) > 40) go(e.clientX < sx ? Math.ceil((sx - e.clientX) / 120) : -Math.ceil((e.clientX - sx) / 120)); sx = null; });
  ov._keys = (e) => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); if (e.key === 'Enter') cap.querySelector('#flOpen').click(); };
  render();
}

// ---- Hangi Yıl? ----
function openQuiz() {
  const pool = DATA.ex.filter((e) => e.year >= 2008 && e.year <= 2026 && e.roomId !== 'kisisel' && (e.caption || '').length > 25 && !/\b(19|20)\d{2}\b/.test(exhibitTitle(e)));
  const rounds = []; const used = new Set(); while (rounds.length < 10 && used.size < pool.length) { const e = pool[Math.floor(Math.random() * pool.length)]; if (used.has(e.exhibitId)) continue; used.add(e.exhibitId); rounds.push(e); }
  let k = 0, score = 0, streak = 0, timer = 0, t0 = 0; const body = el('div');
  const m = modal({ id: 'quiz', kicker: 'Oyun', title: 'Hangi Yıl?', sub: 'Eseri görün, hangi yıla ait olduğunu tahmin edin. Hızlı ve seri doğru cevaplar bonus kazandırır.', body, wide: 980 });
  Layer.open('quiz', m, { onClose: () => cancelAnimationFrame(timer) });
  const mask = (s) => s.replace(/\b(19|20)\d{2}\b/g, '····');
  function show() {
    cancelAnimationFrame(timer); const e = rounds[k]; if (!e) return end();
    const opts = new Set([e.year]); while (opts.size < 4) { const y = clamp(e.year + Math.round((Math.random() - 0.5) * 8), 2008, 2026); opts.add(y); }
    const arr = [...opts].sort(() => Math.random() - 0.5);
    body.innerHTML = `<div class="qz"><div class="qimg"><img alt=""></div><div><div class="qscore"><span>Soru <b>${k + 1}</b>/10</span><span>Puan <b>${score}</b></span><span>Seri <b>${streak}</b></span><span>Rekor <b>${CNT.quizBest}</b></span></div><p style="margin:14px 0 0;color:#ddd2bb;line-height:1.6">${esc(mask((e.caption || '').slice(0, 260)))}${(e.caption || '').length > 260 ? '…' : ''}</p><div class="qtimer"><i></i></div><div class="qopts">${arr.map((y) => `<button data-y="${y}">${y}</button>`).join('')}</div><div id="qfb" style="min-height:44px;margin-top:12px;font-size:13.5px"></div></div></div>`;
    setImg(body.querySelector('img'), e.exhibitId).then(() => Bin.url('f', e.exhibitId).then((u) => { const im = body.querySelector('.qimg img'); if (im) im.src = u; }).catch(() => {}));
    const bar = body.querySelector('.qtimer i'); t0 = performance.now(); const T = 20000;
    const tick = () => { const p = (performance.now() - t0) / T; bar.style.transform = `scaleX(${Math.max(0, 1 - p)})`; if (p >= 1) answer(null); else timer = requestAnimationFrame(tick); }; timer = requestAnimationFrame(tick);
    body.querySelectorAll('.qopts button').forEach((b) => (b.onclick = () => answer(+b.dataset.y)));
  }
  function answer(y) {
    cancelAnimationFrame(timer); const e = rounds[k], ok = y === e.year, fast = performance.now() - t0 < 7000;
    body.querySelectorAll('.qopts button').forEach((b) => { b.disabled = true; if (+b.dataset.y === e.year) b.classList.add('ok'); else if (+b.dataset.y === y) b.classList.add('no'); });
    if (ok) { streak++; score += 1; AudioSys.play('right', 0.8); buzz(20); if (streak >= 3) Confetti.burst(innerWidth / 2, innerHeight / 3, 60); } else { streak = 0; AudioSys.play('wrong', 0.7); buzz([40, 30, 40]); }
    body.querySelector('#qfb').innerHTML = `${ok ? `<b style="color:var(--ok)">Doğru!${fast ? ' Çok hızlıydın.' : ''}</b>` : `<b style="color:var(--bad)">${y == null ? 'Süre doldu.' : 'Olmadı.'}</b> Doğru cevap ${e.year}.`} <span style="color:var(--mute)">Salon: ${esc(roomById(e.roomId).name)}</span> <button class="btn btn-ghost" style="height:32px;margin-left:6px" id="qGo">${I('door')}Müzede gör</button> <button class="btn btn-gold" style="height:32px" id="qNext">${k < 9 ? 'Sonraki' : 'Sonucu gör'} ${I('right')}</button>`;
    body.querySelector('#qGo').onclick = () => { Layer.close('quiz'); viewInMuseum(e); };
    body.querySelector('#qNext').onclick = () => { k++; show(); };
  }
  function end() {
    const best = Math.max(CNT.quizBest, score); const rec = score > CNT.quizBest; CNT.quizBest = best; LS.set('cnt', CNT); checkBadges();
    if (rec) Confetti.burst(); AudioSys.play('reward', 0.7);
    body.innerHTML = `<div style="text-align:center;padding:20px 0"><div class="kick">SONUÇ</div><div class="disp" style="font-size:72px;color:var(--gold-2);font-weight:800;line-height:1">${score}<span style="font-size:28px;color:var(--mute)">/10</span></div><p style="color:var(--mute)">${rec ? 'Yeni rekor!' : `Rekorun ${best}/10.`} ${score >= 7 ? 'Sektör hafızan sağlam.' : score >= 4 ? 'Fena değil; koridorlarda biraz daha dolaşmak iyi gelebilir.' : 'Müze tam da bunun için var.'}</p><button class="btn btn-gold" id="qAgain">${I('random')}Yeniden oyna</button></div>`;
    body.querySelector('#qAgain').onclick = () => { Layer.close('quiz'); openQuiz(); };
  }
  show();
}

// ---- detay paneline ek araçlar: fener, kartpostal, sesli okuma, dergi modu, daktilo ----
on('detail', (e) => setTimeout(() => {
  const d = $('#detail'); if (!d || detailEx !== e) return;
  const tools = d.querySelector('.d-tools'); const stage = d.querySelector('.d-stage');
  const tb = el('button', { class: 'ibtn', title: 'Fener modu' }, `${I('target')}<span class="lbl">Fener</span>`);
  tb.onclick = () => { click(); let t = stage.querySelector('.torch'); if (t) { t.remove(); tb.classList.remove('on'); return; } t = el('div', { class: 'torch' }); stage.append(t); tb.classList.add('on'); stage.addEventListener('pointermove', (ev) => { const r = stage.getBoundingClientRect(); t.style.setProperty('--tx', ev.clientX - r.left + 'px'); t.style.setProperty('--ty', ev.clientY - r.top + 'px'); }); };
  const pc = el('button', { class: 'ibtn', title: 'Kartpostal oluştur' }, `${I('send')}<span class="lbl">Kartpostal</span>`); pc.onclick = () => { click(); postcard(e); };
  const bkb = el('button', { class: 'ibtn', title: 'Dergi modunda aç' }, `${I('book')}<span class="lbl">Dergi</span>`); bkb.onclick = () => { click(); closeDetail(); openBook(e.roomId); };
  tools.append(tb, pc, bkb);
  if (AudioSys.hasTTS()) { const rd = el('button', { class: 'ibtn', title: 'Sesli oku' }, `${I('vol')}<span class="lbl">Oku</span>`); rd.onclick = () => { click(); AudioSys.tts([exhibitTitle(e), e.caption].filter(Boolean).join('. ')); }; tools.append(rd); }
  // typewriter caption
  const p = d.querySelector('.d-sec p'); if (p && !ST.settings.reduce) { const full = p.textContent; const step = Math.max(1, Math.ceil(full.length / 70)); let n = 0; p.textContent = ''; const iv = setInterval(() => { n += step; p.textContent = full.slice(0, n); if (n >= full.length || detailEx !== e) { p.textContent = full; clearInterval(iv); } }, 16); }
}, 0));

  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#f7efdc'); g.addColorStop(1, '#e8d8b0'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 2500; i++) { x.fillStyle = `rgba(120,90,40,${Math.random() * 0.05})`; x.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
  x.strokeStyle = '#9e3d2f'; x.lineWidth = 10; x.strokeRect(24, 24, W - 48, H - 48); x.strokeStyle = '#2d5f8f'; x.lineWidth = 10; x.setLineDash([60, 30]); x.strokeRect(40, 40, W - 80, H - 80); x.setLineDash([]);
  const url = await Bin.url('f', e.exhibitId).catch(() => Bin.url('t', e.exhibitId));
  const img = new Image(); img.src = url; await img.decode().catch(() => {});
  const mw = 820, mh = 760, r = Math.min(mw / img.width, mh / img.height), iw = img.width * r, ih = img.height * r;
  x.save(); x.translate(110 + mw / 2, 140 + mh / 2); x.rotate(-0.035); x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 30; x.shadowOffsetY = 12; x.fillStyle = '#fff'; x.fillRect(-iw / 2 - 18, -ih / 2 - 18, iw + 36, ih + 70); x.shadowColor = 'transparent'; x.drawImage(img, -iw / 2, -ih / 2, iw, ih); x.fillStyle = '#5a4a33'; x.font = `italic 22px ${DISP}`; x.textAlign = 'center'; x.fillText(dateLine(e), 0, ih / 2 + 40); x.restore();
  x.strokeStyle = 'rgba(90,70,40,.5)'; x.lineWidth = 2; x.beginPath(); x.moveTo(1010, 150); x.lineTo(1010, 950); x.stroke();
  x.textAlign = 'left'; x.fillStyle = '#2a2014'; x.font = `600 22px 'IBM Plex Mono', monospace`; x.fillText('WORKSHOP DERGİSİ İLE', 1050, 300);
  x.font = `italic 600 40px ${DISP}`; const lines = ['Türk İlaç Sektörü', 'Tarihi Sanal Müzesi’nden', 'selamlar!']; lines.forEach((l, i) => x.fillText(l, 1050, 362 + i * 52));
  x.font = `28px ${DISP}`; x.fillStyle = '#4a3d2a'; const t = exhibitTitle(e); let line = '', y = 560; for (const w of t.split(' ')) { if (x.measureText(line + w).width > 470) { x.fillText(line, 1050, y); y += 40; line = ''; } line += w + ' '; } x.fillText(line, 1050, y);
  x.strokeStyle = 'rgba(90,70,40,.35)'; for (let i = 0; i < 3; i++) { x.beginPath(); x.moveTo(1050, 800 + i * 52); x.lineTo(1520, 800 + i * 52); x.stroke(); }
  x.save(); x.translate(1440, 175); x.rotate(0.18); x.strokeStyle = '#9e3d2f'; x.lineWidth = 5; x.beginPath(); x.arc(0, 0, 78, 0, 7); x.stroke(); x.beginPath(); x.arc(0, 0, 58, 0, 7); x.stroke(); x.fillStyle = '#9e3d2f'; x.textAlign = 'center'; x.font = `700 26px ${DISP}`; x.fillText(roomById(e.roomId).tag, 0, 8); x.font = `500 13px 'IBM Plex Mono', monospace`; x.fillText('SANAL MÜZE', 0, 34); x.restore();
  x.strokeStyle = 'rgba(158,61,47,.6)'; x.lineWidth = 3; for (let i = 0; i < 4; i++) { x.beginPath(); for (let k = 0; k < 220; k += 10) x.lineTo(1150 + k, 140 + i * 18 + Math.sin(k / 18) * 6); x.stroke(); }
  x.fillStyle = '#7a6a4c'; x.font = `20px 'IBM Plex Mono', monospace`; x.textAlign = 'left'; x.fillText(`Created by Murat Gümrükçü · Eser No. ${e.n} · ${roomById(e.roomId).name}`, 110, 1000);
  c.toBlob((b) => { const u = URL.createObjectURL(b); const body = el('div', { class: 'photo-prev' }, `<img src="${u}" alt="Kartpostal"><div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="btn btn-gold sv">${I('save')}Kartpostalı kaydet</button></div><p class="kick msg" style="text-align:center;margin-top:10px"></p>`); Layer.open('post', modal({ id: 'post', kicker: 'Kartpostal', title: 'Müzeden bir kart', body, wide: 900 })); body.querySelector('.sv').onclick = () => saveBlob(b, `kartpostal-${e.exhibitId}.jpg`, body.querySelector('.msg')); }, 'image/jpeg', 0.92);
}
